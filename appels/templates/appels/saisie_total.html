{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <title>Saisie</title>
</head>
<body>
    <div class="entete-page">
        <h1>{% if modif %}Modifier une saisie{% else %}Nouvelle saisie{% endif %}</h1>
        <form method="post" action="{% url 'account:deconnexion' %}">
            {% csrf_token %}
            <button type="submit">Déconnexion</button>
        </form>
    </div>

    <p class="nav">
        <a href="{% url 'appels:liste_saisies' %}">Mes saisies</a>
        <a href="{% url 'appels:tableau_general' %}">Tableau général</a>
    </p>

    <div class="carte">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Suivant</button>
        </form>
    </div>
</body>
</html>
